# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && xcodegen
name: DrinkYourWater
options:
  bundleIdPrefix: com.aistudio.drinkyourwater
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set this to your Apple Developer Team ID (or pick the team in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  DrinkYourWater:
    type: application
    platform: iOS
    sources:
      - path: DrinkYourWater
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Drink Your Water
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.aistudio.drinkyourwater.hydra.refresh
    entitlements:
      path: Config/DrinkYourWater.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.drinkyourwater.hydra
        PRODUCT_NAME: DrinkYourWater
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  DrinkYourWaterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrinkYourWaterTests
    dependencies:
      - target: DrinkYourWater
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.drinkyourwater.hydra.tests
schemes:
  DrinkYourWater:
    build:
      targets:
        DrinkYourWater: all
        DrinkYourWaterTests: [test]
    test:
      config: Debug
      targets:
        - DrinkYourWaterTests
    run:
      config: Debug
    archive:
      config: Release
