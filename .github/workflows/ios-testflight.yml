name: iOS TestFlight

# Manual only: Actions tab > "iOS TestFlight" > Run workflow.
# Archives a signed Release build and uploads it to App Store Connect, where it appears in
# TestFlight after Apple finishes processing (usually 5-30 minutes).
#
# Needs these repository secrets (Settings > Secrets and variables > Actions), from an
# App Store Connect API key with the Admin role (Users and Access > Integrations > Team Keys):
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the keys list
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_XXXX.p8 file
# Signing is automatic: Xcode creates the certificate, App ID and provisioning profile.

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    # App Store Connect only accepts builds made with Xcode 26 (iOS 26 SDK) or newer.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check App Store Connect secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the comment at the top of this workflow)."
            exit 1
          fi
          # Rebuild the key file from whatever was pasted: tolerates CRLF line endings,
          # surrounding quotes or spaces, literal "\n", a missing BEGIN/END line, or the
          # whole file base64-encoded. Never prints the key itself.
          strip() { tr -d '\r' | sed -E 's/\\n//g; s/-----(BEGIN|END) PRIVATE KEY-----//g' | tr -d " \t\n\"'"; }
          body=$(printf '%s' "$ASC_KEY_P8" | strip)
          if printf '%s' "$body" | base64 -d 2>/dev/null | grep -aq 'BEGIN PRIVATE KEY'; then
            body=$(printf '%s' "$body" | base64 -d | strip)
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 isn't a usable private key (${#body} key characters after cleanup; a real one is about 200)."
            if [[ "$ASC_KEY_P8" =~ ^[[:space:]]*[A-Z0-9]{10}[[:space:]]*$ ]]; then
              echo "::error::It looks like the Key ID. Paste the contents of the AuthKey_XXXX.p8 file instead."
            elif [[ "$ASC_KEY_P8" =~ ^[[:space:]]*[0-9a-fA-F-]{36}[[:space:]]*$ ]]; then
              echo "::error::It looks like the Issuer ID. Paste the contents of the AuthKey_XXXX.p8 file instead."
            else
              echo "::error::Open AuthKey_XXXX.p8 in a text editor and paste everything, including the BEGIN and END lines."
            fi
            rm -f "$key"
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[[:space:]]*[A-Z0-9]{10}[[:space:]]*$ ]] || echo "::warning::ASC_KEY_ID doesn't look like a 10-character key ID."
          [[ "$ASC_ISSUER_ID" =~ ^[[:space:]]*[0-9a-fA-F-]{36}[[:space:]]*$ ]] || echo "::warning::ASC_ISSUER_ID doesn't look like an issuer ID (a UUID like 69a6de7f-...)."
          echo "API key file looks valid."

      - name: Install XcodeGen and generate project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Archive (build number = run number)
        run: |
          xcodebuild archive \
            -project DrinkYourWater.xcodeproj \
            -scheme DrinkYourWater \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DrinkYourWater.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > archive.log 2>&1 && status=0 || status=$?
          grep -E "error:|\*\* ARCHIVE" archive.log || true
          if [ "$status" -ne 0 ]; then tail -n 60 archive.log; exit $status; fi

      - name: Export and upload to App Store Connect
        run: |
          TEAM_ID=$(grep -E '^\s*DEVELOPMENT_TEAM:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DrinkYourWater.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 && status=0 || status=$?
          grep -E "error:|\*\* EXPORT|Upload|uploaded" export.log || true
          if [ "$status" -ne 0 ]; then tail -n 60 export.log; exit $status; fi
          echo "Uploaded build ${{ github.run_number }}. It shows up in App Store Connect > TestFlight once Apple finishes processing."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: ios/*.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
