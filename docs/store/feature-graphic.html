<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1024px;height:500px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:radial-gradient(circle at 78% 45%,#1A6FA8 0%,#0D3B6B 38%,#0B2447 70%,#0A1830 100%);color:#fff;position:relative}
.ripple{position:absolute;border-radius:50%;border:2px solid rgba(72,202,228,.13)}
.left{position:absolute;left:64px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:26px}
.icon{width:112px;height:112px;border-radius:26px;box-shadow:0 0 40px rgba(72,202,228,.45),0 10px 30px rgba(0,0,0,.4)}
h1{font-size:54px;line-height:1.02;font-weight:800;letter-spacing:-1px}
.tag{font-size:31px;line-height:1.25;font-weight:700;color:#7FE3F5;margin-bottom:22px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:17px;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(202,233,255,.25);color:#E8F4FD}
.phone{position:absolute;right:96px;top:50px;width:206px;height:400px;border-radius:34px;padding:7px;background:#05101f;
 box-shadow:0 0 0 2px rgba(202,233,255,.25),0 0 70px rgba(72,202,228,.35),0 24px 50px rgba(0,0,0,.55);transform:rotate(4deg)}
.screen{width:100%;height:100%;border-radius:28px;background:url('../../ios/screenshots-preview/light-checkin.jpg') 50% 100%/100% auto no-repeat}
</style></head><body>
<div class="ripple" style="width:520px;height:520px;right:-20px;top:-10px"></div>
<div class="ripple" style="width:700px;height:700px;right:-110px;top:-100px"></div>
<div class="left">
 <div class="brand"><img class="icon" src="../../ios/DrinkYourWater/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"><h1>Drink Your<br>Water</h1></div>
 <div class="tag">Reminders that wait<br>for your check-in.</div>
 <div class="chips"><span class="chip">Full-screen check-ins</span><span class="chip">Real streaks</span><span class="chip">No account · No tracking</span></div>
</div>
<div class="phone"><div class="screen"></div></div>
</body></html>
